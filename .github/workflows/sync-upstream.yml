# D-02 : mise à jour depuis le dépôt source.
# Chaque semaine (ou à la demande), dans le dépôt d'un groupe créé par « Deploy to Cloudflare »,
# récupère la branche main de karalix/archives-scoutes et ouvre / met à jour une pull request.
# Fusionner la pull request redéploie l'application et applique les migrations (npm run deploy).
#
# Réglage requis une fois : Settings → Actions → General → Workflow permissions →
#   « Read and write permissions » + « Allow GitHub Actions to create and approve pull requests ».
# Facultatif : secret SYNC_TOKEN (jeton fine-grained : Contents, Pull requests, Workflows en écriture),
#   nécessaire quand une mise à jour modifie les fichiers .github/workflows/ (GITHUB_TOKEN ne le peut pas).
name: Synchronisation avec le dépôt source

on:
  schedule:
    - cron: '17 5 * * 1' # lundi 5 h 17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    # Ne fait rien dans le dépôt source lui-même
    if: github.repository != 'karalix/archives-scoutes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UPSTREAM_REPO: karalix/archives-scoutes
      UPSTREAM_BRANCH: main
      SYNC_BRANCH: sync/upstream
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      # Fichiers propres à l'instance : la version du groupe est conservée (ex. identifiants
      # D1/R2 écrits par le bouton de déploiement, juridiction EU du bucket).
      KEEP_OURS: wrangler.jsonc
      GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Récupérer le dépôt source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

      - name: Préparer la branche de synchronisation
        id: merge
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" "origin/${BASE_BRANCH}"; then
            echo "Déjà à jour avec ${UPSTREAM_REPO}."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout -B "${SYNC_BRANCH}" "origin/${BASE_BRANCH}"
          # Le dépôt créé par le bouton n'a pas d'historique commun avec la source :
          # --allow-unrelated-histories pour la première fois ; en cas de conflit, la version
          # source l'emporte (-X theirs), sauf pour les fichiers propres à l'instance.
          git merge --no-edit --allow-unrelated-histories -X theirs \
            -m "Mise à jour depuis ${UPSTREAM_REPO}@$(git rev-parse --short "upstream/${UPSTREAM_BRANCH}")" \
            "upstream/${UPSTREAM_BRANCH}"
          KEPT=""
          for f in ${KEEP_OURS}; do
            if git cat-file -e "origin/${BASE_BRANCH}:${f}" 2>/dev/null && ! git diff --quiet "origin/${BASE_BRANCH}" HEAD -- "$f"; then
              git checkout "origin/${BASE_BRANCH}" -- "$f"
              KEPT="${KEPT} ${f}"
            fi
          done
          if [ -n "${KEPT}" ]; then
            git commit -m "Conserve la configuration de l'instance :${KEPT}"
          fi
          if git diff --quiet "origin/${BASE_BRANCH}" HEAD; then
            echo "Aucune différence de contenu."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "kept=${KEPT}" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Pousser la branche
        if: steps.merge.outputs.changed == 'true'
        run: |
          if ! git push --force origin "${SYNC_BRANCH}"; then
            echo "::error::Push refusé. Si la mise à jour modifie .github/workflows/, ajoutez le secret SYNC_TOKEN (voir l'en-tête de ce fichier)."
            exit 1
          fi

      - name: Ouvrir ou mettre à jour la pull request
        if: steps.merge.outputs.changed == 'true'
        env:
          KEPT: ${{ steps.merge.outputs.kept }}
          VERSION: ${{ steps.merge.outputs.version }}
        run: |
          set -euo pipefail
          TITLE="Mise à jour depuis le dépôt source"
          {
            echo "Mise à jour automatique depuis [${UPSTREAM_REPO}](https://github.com/${UPSTREAM_REPO}) (version ${VERSION})."
            echo
            echo "**Fusionner cette pull request redéploie l'application et applique les migrations de la base.** Les migrations sont additives (D-03) et une sauvegarde hebdomadaire de la base existe (L-14)."
            echo
            if [ -n "${KEPT}" ]; then
              echo "> Fichiers propres à votre instance conservés tels quels :${KEPT}. Comparez-les avec la version source si la note de version le demande :"
              for f in ${KEPT}; do echo "> https://github.com/${UPSTREAM_REPO}/blob/${UPSTREAM_BRANCH}/${f}"; done
              echo
            fi
            echo "### Changements"
            echo
            git log --no-merges --pretty='- %s (%h)' "origin/${BASE_BRANCH}..upstream/${UPSTREAM_BRANCH}" | head -n 50
            echo
            echo "_Pull request créée par le workflow « Synchronisation avec le dépôt source »._"
          } > pr-body.md
          PR=$(gh pr list --head "${SYNC_BRANCH}" --base "${BASE_BRANCH}" --state open --json number --jq '.[0].number // empty')
          if [ -n "${PR}" ]; then
            gh pr edit "${PR}" --title "${TITLE}" --body-file pr-body.md
            echo "Pull request #${PR} mise à jour."
          else
            gh pr create --head "${SYNC_BRANCH}" --base "${BASE_BRANCH}" --title "${TITLE}" --body-file pr-body.md
          fi
